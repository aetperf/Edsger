[build-system]
requires = ["setuptools>=61.0", "setuptools_scm[toml]>=6.3.1", "wheel", "Cython>=3", "numpy>=1.26"]
build-backend = "setuptools.build_meta"

[project]
name = "edsger"
dynamic = ["version"]
description = "Graph algorithms in Cython."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT License"}
authors = [
    { name = "François Pacull", email = "francois.pacull@architecture-performance.fr" },
]
maintainers = [
    { name = "François Pacull", email = "francois.pacull@architecture-performance.fr" },
]
keywords = ["python", "graph", "shortest path", "Dijkstra"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering"
]
dependencies = [
  "numpy>=1.26",
  "pandas",
]

[project.optional-dependencies]
# Polars dataframes, as input or output (output="polars").
polars = [
    "polars"
]
# Dev dependencies.
dev = [
    "ruff",
    "ty"
]
# Test dependencies. 
# pip install .'[test]' on Linux
test = [
    "pytest",
    "scipy",
    "polars",
    "pyarrow"
]
# Doc dependencies.
doc = [
    "sphinx",
    "furo",
    "myst-parser",
    "sphinx-copybutton"
]

[project.urls]
Repository = "https://github.com/aetperf/Edsger"
Documentation = "https://edsger.readthedocs.io"

[tool.setuptools.package-data]
# PEP 561: the package is typed, the Cython modules through their stubs
edsger = ["py.typed", "*.pyi"]

[tool.setuptools_scm]
version_scheme = "no-guess-dev"
write_to = "src/edsger/_version.py"
write_to_template = '__version__ = "{version}"'

[tool.pytest.ini_options]
testpaths = [
    "tests"
]
markers = [
    "performance: marks tests as performance benchmarks (deselect with '-m \"not performance\"')",
]

[tool.ruff]
target-version = "py310"
line-length = 88
extend-exclude = ["old", "notebooks", "edsger-env", "build", ".claude"]

[tool.ruff.lint]
# pyflakes, the error subset of pycodestyle, bugbear, pyupgrade, isort
select = ["E4", "E7", "E9", "F", "B", "UP", "I"]

[tool.ruff.lint.isort]
known-first-party = ["edsger"]

[tool.ty.src]
include = ["src"]

[tool.ty.environment]
python-version = "3.10"

[tool.cibuildwheel]
# Skip 32-bit i686 architectures (outdated, rarely needed)
skip = "*_i686"
# Smoke test of each wheel, in a fresh environment: every compiled module is
# imported, and a few algorithms are run. It catches the wheels that cannot be
# imported (missing symbols, illegal instructions). The full test suite is not
# run: one test depends on the FMA instructions of native builds.
test-command = "python {project}/scripts/wheel_smoke_test.py"
# NumPy and pandas have no 32-bit Windows wheels: pip would build them from
# source in the test environment, and fails
test-skip = "*-win32"

[tool.cibuildwheel.linux]
# The Linux wheels are built with Clang: its code for the Dijkstra kernel is
# about 8% faster than the one of GCC (USA road network, baseline x86-64).
# lld is the linker used for -flto.
before-all = "dnf install -y clang lld"
environment = { CC = "clang", LDFLAGS = "-fuse-ld=lld" }

[[tool.cibuildwheel.overrides]]
# The musllinux images are based on Alpine
select = "*-musllinux*"
before-all = "apk add clang lld"